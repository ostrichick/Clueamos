<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.45)"/>
      <stop offset="60%" stop-color="rgba(217, 119, 6, 0.1)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.6)"/>
    </linearGradient>
  </defs>

  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#d97706" stroke-width="6" opacity="0.4"/>

  <!-- Magnifying Glass Rim -->
  <circle cx="220" cy="220" r="130" fill="url(#glassGrad)" stroke="url(#goldGrad)" stroke-width="24"/>
  <circle cx="220" cy="220" r="142" fill="none" stroke="#78350f" stroke-width="4" opacity="0.6"/>

  <!-- Glass Glint Highlight -->
  <ellipse cx="170" cy="170" rx="45" ry="25" transform="rotate(-40 170 170)" fill="white" opacity="0.35"/>

  <!-- Clue 'C' Monogram inside Glass -->
  <text x="220" y="260" font-family="Georgia, serif" font-size="120" font-weight="900" fill="url(#goldGrad)" text-anchor="middle">C</text>

  <!-- Magnifying Glass Handle -->
  <g transform="rotate(45 220 220)">
    <!-- Brass Collar -->
    <rect x="208" y="350" width="24" height="24" rx="4" fill="url(#goldGrad)"/>
    <!-- Mahogany Handle -->
    <rect x="210" y="374" width="20" height="90" rx="8" fill="#451a03" stroke="#b45309" stroke-width="3"/>
    <!-- Brass End Cap -->
    <circle cx="220" cy="466" r="10" fill="url(#goldGrad)"/>
  </g>
</svg>
